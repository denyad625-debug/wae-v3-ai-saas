pages:
  -
    slug: home
    name: Home
    path: "/"
    layout: marketing
    sections:
      -
        componentId: visual-background
        order: 0
        props:
          capabilities:
            - procedural-background
            - image-preview
            - shader-background
          title: Nimbus
      -
        componentId: navbar
        order: 1
        variant: transparent
        props:
          sticky: true
          ctaButton: true
          transparent: true
          brand: Nimbus
          links:
            -
              label: Features
              href: "/features"
            -
              label: Contact
              href: "/contact"
          ctaText: Get Started
      -
        componentId: hero-centered
        order: 2
        variant: with-image-right
        props:
          textAlign: center
          headline: Intelligent document automation for modern teams
          subtitle: Nimbus is an AI SaaS platform that extracts, summarizes and routes unstructured documents into your existing workflows.
          metrics:
            -
              value: 2.4M
              label: Documents processed monthly
            -
              value: "99.2"
              label: Average accuracy
          ctaText: Get Started
          ctaLink: "/contact"
      -
        componentId: pricing-table
        order: 3
        variant: 3-tier
        props:
          headline: Simple, Transparent Pricing
          subtitle: Choose the plan that fits your needs.
          pricing:
            -
              name: Starter
              price: "$0"
              description: For trying Nimbus with your own documents.
              features:
                - 200 pages / month
                - Extract + Summarize
                - Community support
            -
              name: Growth
              price: "$99"
              description: For teams that need reliable volume.
              features:
                - 10,000 pages / month
                - All modules
                - Priority support
            -
              name: Enterprise
              price: Custom
              description: For scale, security and control.
              features:
                - Unlimited pages
                - SOC 2 + SSO/SAML
                - Dedicated manager
      -
        componentId: feature-grid
        order: 4
        variant: 3-col
        props:
          columns: 4
          headline: Key Features
          subtitle: Built to help you move faster.
          features:
            -
              title: Nimbus Extract
              description: Turn PDFs, invoices and contracts into clean structured data.
            -
              title: Nimbus Summarize
              description: Concise summaries of long documents, tuned to the questions your team asks.
            -
              title: Nimbus Route
              description: Route each document to the right person or system without rules that break.
      -
        componentId: stats-bar
        order: 5
        variant: 3-stat
        props:
          headline: Our Impact
          subtitle: Numbers that speak for themselves.
          stats:
            -
              label: Documents processed monthly
              value: 2.4M
            -
              label: Average accuracy
              value: "99.2"
            -
              label: Hours saved per week
              value: "18"
      -
        componentId: cta-banner
        order: 6
        variant: with-image
        props:
          background: gradient
          headline: "Ready to drive product signups and conversions; promote an AI platform?"
          ctaText: Get Started
          ctaLink: "/contact"
          testimonial:
            quote: Nimbus cut our invoice processing time from hours to minutes. The accuracy is genuinely impressive.
            author: Melisa Ortega
            company: Lumen Retail
          layout: split
          stats:
            -
              value: 2.4M
              label: Documents processed monthly
            -
              value: "99.2"
              label: Average accuracy
            -
              value: "18"
              label: Hours saved per week
      -
        componentId: footer-multi-column
        order: 7
        variant: 4-col
        props:
          description: Nimbus is an AI SaaS platform that extracts, summarizes and routes unstructured documents into your existing workflows.
          links:
            -
              title: Pages
              items:
                -
                  label: Features
                  url: "/features"
                -
                  label: Contact
                  url: "/contact"
            -
              title: Products
              items:
                -
                  label: Nimbus Extract
                -
                  label: Nimbus Summarize
                -
                  label: Nimbus Route
            -
              title: Offices
              items:
                -
                  label: San Francisco, USA
                  url: "/contact"
                -
                  label: Lisbon, Portugal
                  url: "/contact"
            -
